name: app_martabak
description: "Aplikasi kasir martabak dengan GoQris QRIS payment"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # HTTP Client
  dio: ^5.7.0

  # Secure Storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # QR Code Rendering
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.20.1
  google_fonts: ^6.2.1

  # UI Enhancements
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  badges: ^3.1.2

  # Navigation
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
